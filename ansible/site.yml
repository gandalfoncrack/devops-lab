- name: Set up k3s on the EC2 server and deploy the app
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait until the server accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Install k3s (skipped if it is already installed)
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait until the Kubernetes node is Ready
      ansible.builtin.command: k3s kubectl get nodes
      register: nodes
      until: "' Ready' in nodes.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Write the Kubernetes manifest with this build's image
      ansible.builtin.template:
        src: web.yaml.j2
        dest: /tmp/web.yaml
        mode: "0644"

    - name: Apply the manifest
      ansible.builtin.command: k3s kubectl apply -f /tmp/web.yaml
      register: apply_result
      changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"

    - name: Wait for the rollout to finish
      ansible.builtin.command: k3s kubectl rollout status deployment/web --timeout=180s
      changed_when: false
